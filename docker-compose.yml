# 공통 로그 회전 설정 — 어느 컨테이너든 무제한 누적되지 않게.
# 2026-04-23 호스트 다운 추정 원인 중 하나였던 "로그 폭주 → 디스크 가득" 방지.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

services:
  mariadb:
    logging: *default-logging
    image: mariadb:11.2
    container_name: myplatform-mariadb
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: myplatform
      MYSQL_USER: myplatform
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    # 외부 노출 금지 — 호스트 내 SSH 접속 시에만 127.0.0.1:3306 으로 접근 가능
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      # 초기 세팅용 SQL (필요시 사용)
      - ./setup-database.sql:/docker-entrypoint-initdb.d/01-setup-database.sql
    networks:
      - myplatform-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: myplatform-redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # 외부 노출 금지 — 호스트 로컬에서만 접근 가능
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - myplatform-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # 서버 환경(.env)에 따라 태그(:dev 또는 :prod)가 바뀜
    image: kdhgla/my-server:${DOCKER_TAG:-latest}
    pull_policy: always
    container_name: myplatform-backend
    restart: unless-stopped
    logging: *default-logging
    # 외부 노출 금지 — nginx 가 같은 도커 네트워크에서 backend:8080 으로만 접근.
    # 호스트에서 직접 디버깅이 필요하면 127.0.0.1:8080 만 노출.
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      # 프로필 설정 (dev 또는 prod)
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      # jdbc:mysql:// 사용 필수 — Flyway 의 MySQLDatabaseType 이 'jdbc:mysql:' 스킴만 인식.
      # MariaDB Connector/J 3.0+ 는 mysql 스킴을 기본 거부하므로 permitMysqlScheme=true 명시.
      - DB_URL=jdbc:mysql://mariadb:3306/myplatform?permitMysqlScheme=true&autoReconnect=true&connectTimeout=10000&socketTimeout=60000
      - DB_USERNAME=myplatform
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - FILE_UPLOAD_DIR=/app/uploads
      - TZ=Asia/Seoul
      # [AUDIT R1] 실적(earnings) 입력 소스. false=레거시 일별 스냅샷 / true=분기 원본(V55).
      #   env_file(.env) 단독 의존을 피해 여기 명시한다(§4b — env_file 주입은 컨테이너 '생성' 시점
      #   고정이라 .env 수정 후 restart 만 하면 반영 안 된다. 어느 쪽이든 recreate 필요:
      #   docker compose up -d backend).
      #   ⚠ 켜면 composite 총점·validCount·후보 수가 동시에 움직인다 — 켠 날짜를
      #   docs/SCHEDULE_DECISIONS.md 의 earnings-quarterly-switch 에 반드시 기록할 것.
      #   그 날이 측정 표본의 경계다.
      - RECOMMENDATION_EARNINGS_QUARTERLY_SOURCE=${RECOMMENDATION_EARNINGS_QUARTERLY_SOURCE:-false}
      # CORS 허용 도메인 (콤마 구분). 운영 도메인을 .env 의 APP_CORS_ALLOWED_ORIGINS 로 주입.
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-https://dhkim-lab.duckdns.org}
      # WebAuthn (지문/Face ID) — RP ID 는 도메인, Origin 은 프론트 URL
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-dhkim-lab.duckdns.org}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-https://dhkim-lab.duckdns.org}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-MyPlatform}
      # 매매 안전장치 — 일일 매수 한도 / 대형 거래 알림 임계금액 (원)
      - TRADING_DAILY_BUY_LIMIT_KRW=${TRADING_DAILY_BUY_LIMIT_KRW:-5000000}
      - TRADING_ALERT_THRESHOLD_KRW=${TRADING_ALERT_THRESHOLD_KRW:-1000000}
      # Redis L2 캐시 — 기본 ON. MarketCacheWarmerService 가 시장 데이터를 배치로
      # Redis 에 적재하고 프론트는 Redis HIT 로 응답 받음 → KIS 호출 격리.
      - CACHE_REDIS_ENABLED=${CACHE_REDIS_ENABLED:-true}
      # python-backend (pykrx 시장 국면 V32) — 같은 도커 네트워크로 호출. 미기동 시 국면 미수집(NULL).
      - PYTHON_BACKEND_URL=http://python-backend:8000
      # 외부 API 키 — env_file(.env) 단일 의존 금지. environment 에 명시 이중배선하여
      # .env 수정 후 recreate 누락 시에도 ${..} 치환으로 확실히 주입(catalyst 뉴스=NAVER,
      # AI전략·재료분류=GEMINI). 미설정 시 빈 문자열 → 해당 기능 best-effort 비활성.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID:-}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET:-}
      # 한국은행 ECOS (매크로 tilt 금리 축) — 미설정 시 금리 축 null 로 동작(§4c)
      - ECOS_API_KEY=${ECOS_API_KEY:-}
      # Anthropic (판정 관제실 AI 크루) — 위 키들과 같은 이중배선 원칙.
      # 미설정 시 크루 기능만 DISABLED 되고 사유가 화면에 표시된다(앱 전체는 정상 기동).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CONTROL_ROOM_CREW_MODEL=${CONTROL_ROOM_CREW_MODEL:-claude-opus-5}
      - CONTROL_ROOM_CREW_DAILY_LIMIT=${CONTROL_ROOM_CREW_DAILY_LIMIT:-30}
      # DART 공시 — 미설정 시 DartService.isAvailable()=false 로 공시 모니터가 조용히 전면 정지
      # ("알림 없음 = 공시 없음" 오인의 원인). 위 키들과 같은 이중배선 원칙 적용.
      - DART_API_KEY=${DART_API_KEY:-}
      # 한국수출입은행 환율 — 미설정 시 네이버 스크래핑 폴백으로 조용히 강등
      - KOREAEXIM_API_KEY=${KOREAEXIM_API_KEY:-}
      # ATR 세트(P2-17 실측) 플래그 — VIRTUAL 전용(REAL 2중 하드가드). 이중배선으로
      # .env 수정 후 recreate 누락 시에도 ${} 치환 주입(OPS_CHECKLIST §2-1 권장사항).
      # 2026-07-28 기본 ON — P2-17 VIRTUAL 실측 시작(서버 SSH 부재로 .env 대신 compose 기본값으로 점화).
      # VIRTUAL 전용 + REAL 이중 하드 가드(isAtrSetActive)라 실주문 무영향. 끄려면 .env 에 =false.
      - BOT_ATR_TRADING_ENABLED=${BOT_ATR_TRADING_ENABLED:-true}
      # 캔들 패턴 shadow 감지(V52, 20:20 배치) — 기록 전용(봇/점수/게이트 미연결).
      # 기본 true = 현재 동작 그대로. 코드 기본값도 true 라 동작 변경 없이 '끌 수단'만 확보한다
      # (이전엔 어디에도 선언이 없어 코드 수정 없이는 정지 불가였다). 끄려면 .env 에 =false.
      - PATTERN_DETECTION_ENABLED=${PATTERN_DETECTION_ENABLED:-true}
    deploy:
      resources:
        limits:
          memory: 1536M
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - myplatform-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  python-backend:
    image: ${DOCKER_USERNAME:-kdhgla}/my-python:${DOCKER_TAG:-latest}
    pull_policy: always
    container_name: myplatform-python
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
    # 외부 노출 금지 — nginx 가 도커 네트워크로 python-backend:8000 호출
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # regime/sector 가 KOSPI 일봉을 Java(KIS 지수)에서 받아옴 — pykrx 지수 엔드포인트 대체(2026-06-30)
      - JAVA_BACKEND_URL=http://backend:8080
      - TZ=Asia/Seoul
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - myplatform-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:1.25-alpine
    container_name: myplatform-nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      # 80: ACME 챌린지 + HTTPS 리다이렉트  /  443: 실제 서비스
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - nginx_logs:/var/log/nginx
      # Let's Encrypt 인증서 / ACME 챌린지 웹루트
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot-webroot:/var/www/certbot
      # ── jewelry-leads(vorj-map) 동거 — 서버블록 + 정적 마운트 ─────────────
      # ⚠️ jewelry.conf 는 vorj-map 인증서가 있어야 nginx 가 뜬다(2단계 배포).
      - ./nginx/jewelry.conf:/etc/nginx/conf.d/jewelry.conf:ro
      # jewelry 프론트 dist. my-platform 트리 안(dev 소유)이라 git clone 과 충돌 없음.
      # jewelry-leads 배포(deploy.yml)가 이 경로로 dist 를 전송한다.
      # ⚠️ 읽기전용 html(위) 안쪽에 중첩 마운트하면 도커가 mountpoint 를 못 만들어
      #    (read-only file system) nginx 검증이 실패한다. 반드시 html 바깥 형제 경로에 마운트.
      - ./nginx/jewelry-dist:/usr/share/nginx/jewelry:ro
      # ── seah(세아 생산관리) 동거 — 마운트 보류(2026-08-21) ────────────────
      # nginx/seah.conf 는 그대로 두고 마운트만 뺀다.
      # 이유: seah 도메인 인증서가 없어 마운트 상태로 nginx 가 recreate 되면 부팅
      # 실패 → my-platform·jewelry 까지 동반 다운. 게다가 seah.duckdns.org 가 우리
      # 서버를 가리키지 않아(다른 IP) 인증서 발급 자체가 현재 불가라 해소 시점이 열려 있다.
      # deploy.yml 의 seah 인증서 가드는 아래 seah.conf volume 라인이 "활성"일 때만 발화한다(2026-09-02).
      # 파일 존재만 보던 동안엔 보류 상태에서도 매 배포 nginx 재생성이 조용히 스킵됐다.
      # 되살리는 순서: ① 도메인 확정(선점 시 새 이름) → ② 인증서 발급 → ③ 아래 2줄 복원
      #   (복원하는 순간 가드가 다시 켜져, 인증서 없이는 nginx 재생성을 건너뛴다 — 순서 지킬 것).
      #   - ./nginx/seah.conf:/etc/nginx/conf.d/seah.conf:ro
      #   - ./nginx/seah-dist:/usr/share/nginx/seah:ro
    depends_on:
      - backend
      - python-backend
    networks:
      - myplatform-network
    healthcheck:
      # localhost 가 IPv6 (::1) 로 풀리는 환경 회피 — IPv4 강제
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 인증서 자동 갱신 — 12시간마다 시도. Let's Encrypt 가 만료 30일 전부터 갱신 처리.
  certbot:
    image: certbot/certbot:latest
    container_name: myplatform-certbot
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - ./nginx/certbot-webroot:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  myplatform-network:
    driver: bridge