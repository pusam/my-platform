services:
  mariadb:
    image: mariadb:11.2
    container_name: myplatform-mariadb
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: myplatform
      MYSQL_USER: myplatform
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    # 외부 노출 금지 — 호스트 내 SSH 접속 시에만 127.0.0.1:3306 으로 접근 가능
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      # 초기 세팅용 SQL (필요시 사용)
      - ./setup-database.sql:/docker-entrypoint-initdb.d/01-setup-database.sql
    networks:
      - myplatform-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: myplatform-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # 외부 노출 금지 — 호스트 로컬에서만 접근 가능
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - myplatform-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # 서버 환경(.env)에 따라 태그(:dev 또는 :prod)가 바뀜
    image: kdhgla/my-server:${DOCKER_TAG:-latest}
    pull_policy: always
    container_name: myplatform-backend
    restart: unless-stopped
    # 외부 노출 금지 — nginx 가 같은 도커 네트워크에서 backend:8080 으로만 접근.
    # 호스트에서 직접 디버깅이 필요하면 127.0.0.1:8080 만 노출.
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      # 프로필 설정 (dev 또는 prod)
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      # jdbc:mysql:// 사용 필수 — Flyway 의 MySQLDatabaseType 이 'jdbc:mysql:' 스킴만 인식.
      # MariaDB Connector/J 3.0+ 는 mysql 스킴을 기본 거부하므로 permitMysqlScheme=true 명시.
      - DB_URL=jdbc:mysql://mariadb:3306/myplatform?permitMysqlScheme=true&autoReconnect=true&connectTimeout=10000&socketTimeout=60000
      - DB_USERNAME=myplatform
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - FILE_UPLOAD_DIR=/app/uploads
      - TZ=Asia/Seoul
      # CORS 허용 도메인 (콤마 구분). 운영 도메인을 .env 의 APP_CORS_ALLOWED_ORIGINS 로 주입.
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-https://dhkim-lab.duckdns.org}
      # WebAuthn (지문/Face ID) — RP ID 는 도메인, Origin 은 프론트 URL
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-dhkim-lab.duckdns.org}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-https://dhkim-lab.duckdns.org}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-MyPlatform}
      # 매매 안전장치 — 일일 매수 한도 / 대형 거래 알림 임계금액 (원)
      - TRADING_DAILY_BUY_LIMIT_KRW=${TRADING_DAILY_BUY_LIMIT_KRW:-5000000}
      - TRADING_ALERT_THRESHOLD_KRW=${TRADING_ALERT_THRESHOLD_KRW:-1000000}
      # 봇 스케줄러 전면 kill switch — 기본 true (기존 동작).
      # 장애/디버깅 시 .env 에 BOT_SCHEDULER_ENABLED=false 넣고 컨테이너 재기동하면
      # 모든 @Scheduled 매수/매도 루프가 최상단에서 즉시 return (재배포 불필요).
      - BOT_SCHEDULER_ENABLED=${BOT_SCHEDULER_ENABLED:-true}
      # Redis L2 캐시 — 기본 ON. MarketCacheWarmerService 가 시장 데이터를 배치로
      # Redis 에 적재하고 프론트는 Redis HIT 로 응답 받음 → KIS 호출 격리.
      - CACHE_REDIS_ENABLED=${CACHE_REDIS_ENABLED:-true}
    deploy:
      resources:
        limits:
          memory: 1536M
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - myplatform-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  python-backend:
    image: ${DOCKER_USERNAME:-kdhgla}/my-python:${DOCKER_TAG:-latest}
    pull_policy: always
    container_name: myplatform-python
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    # 외부 노출 금지 — nginx 가 도커 네트워크로 python-backend:8000 호출
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - TZ=Asia/Seoul
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - myplatform-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:1.25-alpine
    container_name: myplatform-nginx
    restart: unless-stopped
    ports:
      # 80: ACME 챌린지 + HTTPS 리다이렉트  /  443: 실제 서비스
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - nginx_logs:/var/log/nginx
      # Let's Encrypt 인증서 / ACME 챌린지 웹루트
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot-webroot:/var/www/certbot
    depends_on:
      - backend
      - python-backend
    networks:
      - myplatform-network
    healthcheck:
      # localhost 가 IPv6 (::1) 로 풀리는 환경 회피 — IPv4 강제
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 인증서 자동 갱신 — 12시간마다 시도. Let's Encrypt 가 만료 30일 전부터 갱신 처리.
  certbot:
    image: certbot/certbot:latest
    container_name: myplatform-certbot
    restart: unless-stopped
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - ./nginx/certbot-webroot:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  myplatform-network:
    driver: bridge