dependencies {
    // Core 모듈
    implementation project(':core')

    // JWT-Redis 모듈
    implementation project(':jwt-redis')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Micrometer Prometheus — /actuator/prometheus 로 JVM/HikariCP/Tomcat/캐시 메트릭 노출
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // AOP (AspectJ for @Scheduled monitoring)
    implementation 'org.aspectj:aspectjweaver'

    // Caffeine Cache (고성능 로컬 캐시)
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // Redis (L2 캐시)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-batch'

    // Swagger (Springdoc OpenAPI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // JWT 의존성은 jwt-redis 모듈에서 제공

    // MariaDB Driver
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.3.1'

    // Flyway Database Migration
    // Spring Boot 4.0 부터 Flyway autoconfig 가 starter 로 분리 — 이 의존성을 빼면
    // flyway-core 가 classpath 에 있어도 FlywayAutoConfiguration 이 로드되지 않음.
    // flyway-mysql 은 MariaDB 지원에도 필요 (단, DB_URL 은 jdbc:mysql:// 형태여야 함)
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // WebClient for external API calls
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // RSS Feed parsing (for news)
    implementation 'com.rometools:rome:2.1.0'

    // Excel export (Apache POI)
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    // Technical Analysis Library (ta4j)
    implementation 'org.ta4j:ta4j-core:0.15'

    // Web Scraping (Jsoup)
    implementation 'org.jsoup:jsoup:1.17.2'

    // WebAuthn (지문/Face ID/패스키 로그인)
    implementation 'com.webauthn4j:webauthn4j-core:0.31.5.RELEASE'

    // Resilience4j — 외부 API (KIS/DART/Gemini) 호출 보호.
    // CircuitBreaker: 연속 실패 시 회로 OPEN → 빠른 실패 + fallback. retry: 일시 오류 자동 재시도.
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-retry:2.2.0'

    // Sentry — 운영 에러 모니터링. SENTRY_DSN 환경변수 없으면 자동 비활성 (noop).
    // 비용 없이 의존성 + 골격만 추가 — DSN 설정 시점부터 동작.
    implementation 'io.sentry:sentry-spring-boot-starter-jakarta:7.18.0'
    implementation 'io.sentry:sentry-logback:7.18.0'
}

// 프론트엔드 빌드 태스크 (CI에서는 -PskipFrontend로 건너뛰기)
task buildFrontend(type: Exec) {
    workingDir '../frontend'

    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'npm install && npm run build'
    } else {
        commandLine 'sh', '-c', 'npm install && npm run build'
    }
}

// 프론트엔드 정적 파일 복사
task copyFrontend(type: Copy) {
    dependsOn buildFrontend
    from '../frontend/dist'
    into 'build/resources/main/static'
}

// bootJar 전에 프론트엔드 빌드 실행 (CI에서는 skipFrontend 프로퍼티로 건너뛰기)
if (!project.hasProperty('skipFrontend')) {
    bootJar {
        dependsOn copyFrontend
    }
    processResources {
        dependsOn copyFrontend
    }
}

