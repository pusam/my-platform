spring:
  application:
    name: my-platform-backend


  # 1. DB 설정
  datasource:
    driverClassName: org.mariadb.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000        # 5분 (유휴 커넥션 정리)
      max-lifetime: 1740000       # 29분 (MariaDB wait_timeout=28800 이내)
      connection-timeout: 10000   # 10초
      leak-detection-threshold: 120000 # 2분 이상 미반환 시 경고 (섹터 배치 50~60초 소요)
      pool-name: MyPlatformPool

  # 2. JPA 기본 설정
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    open-in-view: false
    defer-datasource-initialization: true  # Flyway 이후 JPA 초기화
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # 2-1. Flyway 데이터베이스 마이그레이션 설정
  flyway:
    enabled: true
    baseline-on-migrate: true      # 기존 DB가 있어도 마이그레이션 시작
    baseline-version: 0            # 기존 DB 버전을 0으로 설정
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false            # 순차적 마이그레이션 강제
    table: flyway_schema_history   # 마이그레이션 이력 테이블

  # 3. 메일 설정
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
            connectiontimeout: 5000
            timeout: 5000
            writetimeout: 5000

  # 3-1. Redis 설정 (L2 캐시용)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # 4. 기타 설정
  servlet:
    multipart:
      enabled: true
      max-file-size: 300MB
      max-request-size: 300MB
  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: true
  sql:
    init:
      mode: never

# 5. 커스텀 설정
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

file:
  upload:
    dir: ${FILE_UPLOAD_DIR}

gold:
  api:
    url: https://www.goldapi.io/api/XAU/KRW
    key: ${GOLD_API_KEY}
    gram-per-don: 3.75
silver:
  api:
    url: https://www.goldapi.io/api/XAG/KRW
    key: ${SILVER_API_KEY}
    gram-per-don: 3.75

# Gemini AI 설정
gemini:
  api:
    key: ${GEMINI_API_KEY:}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

# 7. 한국투자증권 API 설정
kis:
  api:
    app-key: ${KIS_APP_KEY:}
    app-secret: ${KIS_APP_SECRET:}
    base-url: ${KIS_BASE_URL:https://openapi.koreainvestment.com:9443}
    # 모의투자: https://openapivts.koreainvestment.com:29443
    account-number: ${KIS_ACCOUNT_NUMBER:}  # 계좌번호 (예: 50012345-01)
    account-prefix: ${KIS_ACCOUNT_PREFIX:}  # 계좌번호 앞 8자리 (CANO)
    account-suffix: ${KIS_ACCOUNT_SUFFIX:01}  # 계좌번호 뒤 2자리 (ACNT_PRDT_CD)

# 8. Reddit API 설정
reddit:
  api:
    client-id: ${REDDIT_CLIENT_ID:}
    client-secret: ${REDDIT_CLIENT_SECRET:}
    user-agent: ${REDDIT_USER_AGENT:my-platform/1.0}
    username: ${REDDIT_USERNAME:}
    password: ${REDDIT_PASSWORD:}

# 9. 텔레그램 알림 설정 (3채널 분리)
# 브리핑: 모닝브리핑, 마감알림, 헬스체크, 시장상태
# 시그널: 수급급증, 선점레이더, 복합조건, 봇매매
# 리스크: 리스크알리미, 킬스위치, 공매도경보
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    enabled: ${TELEGRAM_ENABLED:false}
    token-signal: ${TELEGRAM_BOT_TOKEN_SIGNAL:}
    chat-id-signal: ${TELEGRAM_CHAT_ID_SIGNAL:}
    token-risk: ${TELEGRAM_BOT_TOKEN_RISK:}
    chat-id-risk: ${TELEGRAM_CHAT_ID_RISK:}

# 10. 알림 스케줄러 설정
alert:
  scheduler:
    enabled: ${ALERT_SCHEDULER_ENABLED:false}

# 10-1. 한국수출입은행 환율 API 설정
koreaexim:
  api:
    key: ${KOREAEXIM_API_KEY:}
    url: https://www.koreaexim.go.kr/site/program/financial/exchangeJSON

# 11. DART(전자공시) API 설정
dart:
  api:
    key: ${DART_API_KEY:}

# 12. Naver Search API 설정
naver:
  api:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}

# 13. Redis L2 캐시 설정
cache:
  redis:
    enabled: ${CACHE_REDIS_ENABLED:false}

# 7. Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha