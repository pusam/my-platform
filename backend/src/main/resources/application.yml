spring:
  application:
    name: my-platform-backend

  # Jackson — API 응답/요청 timezone 명시. JVM TZ 누락 환경 대비.
  jackson:
    time-zone: Asia/Seoul
    date-format: yyyy-MM-dd'T'HH:mm:ss
    default-property-inclusion: non_null

  # 1. DB 설정
  datasource:
    driverClassName: org.mariadb.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      idle-timeout: 180000        # 3분 (유휴 커넥션 빠르게 정리: 5분→3분)
      max-lifetime: 1740000       # 29분 (MariaDB wait_timeout 이내)
      connection-timeout: 10000   # 10초
      validation-timeout: 3000    # 유효성 검사 3초
      keepalive-time: 300000      # 5분마다 커넥션 keepalive (죽은 커넥션 조기 감지)
      leak-detection-threshold: 120000 # 2분 이상 미반환 시 경고
      pool-name: MyPlatformPool

  # 2. JPA 기본 설정
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    open-in-view: false
    # defer-datasource-initialization 은 data.sql/schema.sql 전용 속성이며
    # SB 4.0 에서 Flyway autoconfig 와 결합 시 flyway ↔ entityManagerFactory
    # 순환 의존을 유발 → 사용하지 않음 (마이그레이션은 Flyway 가 담당)
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # 2-1. Flyway 데이터베이스 마이그레이션 설정
  # 주의: prod 는 Hibernate ddl-auto: update 로 수명주기 내내 관리됐음.
  # Flyway 를 뒤늦게 도입하므로 baseline-version 을 현재 최신 V 번호(14)로 설정 →
  # 과거 V1~V14 는 "이미 적용됨" 으로 간주하고, V15+ 부터 관리 시작.
  flyway:
    enabled: true
    baseline-on-migrate: true      # 기존 DB가 있어도 마이그레이션 시작
    baseline-version: 14           # V14 까지는 기존 ddl-auto 로 생성됐음으로 간주
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false            # 순차적 마이그레이션 강제
    table: flyway_schema_history   # 마이그레이션 이력 테이블

  # 3. 메일 설정
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
            connectiontimeout: 5000
            timeout: 5000
            writetimeout: 5000

  # 3-1. Redis 설정 (L2 캐시용)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # 4. 기타 설정
  servlet:
    multipart:
      enabled: true
      max-file-size: 300MB
      max-request-size: 300MB
  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: true
  sql:
    init:
      mode: never

# 5. 커스텀 설정
jwt:
  secret: ${JWT_SECRET}
  # legacy fallback — 새 코드는 access-expiration / refresh-expiration 사용
  expiration: 86400000
  access-expiration: 900000      # 15분 — 짧게 유지해 토큰 탈취 시 노출 시간 최소화
  refresh-expiration: 604800000  # 7일 — /api/auth/refresh 로 access 갱신용

file:
  upload:
    dir: ${FILE_UPLOAD_DIR}

gold:
  api:
    url: https://www.goldapi.io/api/XAU/KRW
    key: ${GOLD_API_KEY}
    gram-per-don: 3.75
silver:
  api:
    url: https://www.goldapi.io/api/XAG/KRW
    key: ${SILVER_API_KEY}
    gram-per-don: 3.75

# Gemini AI 설정
gemini:
  api:
    key: ${GEMINI_API_KEY:}
    # gemini-2.0-flash 종료 → gemini-2.5-flash-lite (무료 티어 ≈ 15 RPM, generateContent 규격 동일)
    url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent}

# python-backend (pykrx 보조분석 — V32 시장 국면 소스). 도커에선 PYTHON_BACKEND_URL=http://python-backend:8000
python-backend:
  base-url: ${PYTHON_BACKEND_URL:http://localhost:8000}

# 한국은행 ECOS OpenAPI (매크로 tilt 금리 축, P3-7). 키 미설정 시 금리 축 null(§4c) — 기능 자체는 동작.
ecos:
  api:
    key: ${ECOS_API_KEY:}

# 7. 한국투자증권 API 설정
kis:
  api:
    app-key: ${KIS_APP_KEY:}
    app-secret: ${KIS_APP_SECRET:}
    base-url: ${KIS_BASE_URL:https://openapi.koreainvestment.com:9443}
    # 모의투자: https://openapivts.koreainvestment.com:29443
    account-number: ${KIS_ACCOUNT_NUMBER:}  # 계좌번호 (예: 50012345-01)
    account-prefix: ${KIS_ACCOUNT_PREFIX:}  # 계좌번호 앞 8자리 (CANO)
    account-suffix: ${KIS_ACCOUNT_SUFFIX:01}  # 계좌번호 뒤 2자리 (ACNT_PRDT_CD)
  # NXT/연장장 주문 거래소구분 필드 (2026-09-14 대비) — ⚠ 이름·값 미확정.
  # 9/14 전 KIS Developers order-cash 스펙으로 확정 후 주입. 공란이면 NXT 주문은 fail-CLOSED 로 거부.
  # docs/NXT_ROUTING_DESIGN.md §0.4. (예상: EXCG_ID_DVSN_CD = NXT/SOR — 반드시 KIS 문서 확인.)
  order:
    nxt-exchange-param-name: ${KIS_ORDER_NXT_PARAM_NAME:}
    nxt-exchange-param-value: ${KIS_ORDER_NXT_PARAM_VALUE:}
  # KIS 실시간 WebSocket — 시세/호가/체결 push 채널.
  # 폴링(stockPriceService) 만으로는 매도 시점 지연이 발생 → 보유 종목은 push 로 보완.
  # 기본 비활성 (KisWebSocketService / RealtimePriceBus 빈 자체가 생성 안 됨).
  # 활성화: KIS_WEBSOCKET_ENABLED=true 환경변수.
  # 구독 한도: 실전/모의 41건.
  websocket:
    enabled: ${KIS_WEBSOCKET_ENABLED:false}
    url: ${KIS_WEBSOCKET_URL:ws://ops.koreainvestment.com:21000}
    # 모의투자: ws://ops.koreainvestment.com:31000
    customer-type: ${KIS_WEBSOCKET_CUSTOMER_TYPE:P}
    reconnect-max-attempts: 999
    reconnect-max-backoff-sec: 60

# 8. Reddit API 설정
reddit:
  api:
    client-id: ${REDDIT_CLIENT_ID:}
    client-secret: ${REDDIT_CLIENT_SECRET:}
    user-agent: ${REDDIT_USER_AGENT:my-platform/1.0}
    username: ${REDDIT_USERNAME:}
    password: ${REDDIT_PASSWORD:}

# 9. 텔레그램 알림 설정 (3채널 분리)
# 브리핑: 모닝브리핑, 마감알림, 헬스체크, 시장상태
# 시그널: 수급급증, 선점레이더, 복합조건, 봇매매
# 리스크: 리스크알리미, 킬스위치, 공매도경보
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    enabled: ${TELEGRAM_ENABLED:false}
    token-signal: ${TELEGRAM_BOT_TOKEN_SIGNAL:}
    chat-id-signal: ${TELEGRAM_CHAT_ID_SIGNAL:}
    token-risk: ${TELEGRAM_BOT_TOKEN_RISK:}
    chat-id-risk: ${TELEGRAM_CHAT_ID_RISK:}

# 10. 알림 스케줄러 설정
alert:
  scheduler:
    enabled: ${ALERT_SCHEDULER_ENABLED:false}

# 종합추천(composite) 산식 — A안(P1-6, 2026-07-06) 수급 역상관 방어 flag.
# 수급(supplyDemand) 카테고리는 prod 실측(n=88)에서 단조 역상관 확정(0-4=67% → 15+=35%).
# composite 총점 raw 합산에서만 수급을 min(sd, cap) 으로 상한(표시값·validCount·임계 불변, 가역).
#   기본 10(활성). 20 이상 또는 -1 = 비활성(무캡) — 표본 축적 후 주간리포트 성과 비교로 캡값 재조정.
recommendation:
  supply-demand-cap: ${RECOMMENDATION_SUPPLY_DEMAND_CAP:10}

# 봇 on/off 는 UI 에서 관리 (/paper-trading/bot/start|stop).
# 상태는 bot_config 테이블에 저장되어 서버 재기동 시 자동 복원됨.

# 10-1. 한국수출입은행 환율 API 설정
koreaexim:
  api:
    key: ${KOREAEXIM_API_KEY:}
    url: https://www.koreaexim.go.kr/site/program/financial/exchangeJSON

# 11. DART(전자공시) API 설정
dart:
  api:
    key: ${DART_API_KEY:}

# 12. Naver Search API 설정
naver:
  api:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}

# 13. Redis L2 캐시 설정 — 기본 ON.
# MarketCacheWarmerService 가 시장 데이터(섹터, 스마트머니, 수급급증, AI전략)를
# 배치로 Redis 에 적재하고, 조회 서비스가 Redis HIT 면 KIS 호출 없이 반환.
# 프론트 트래픽이 KIS TPS 에 직접 영향 안 주게 하는 핵심 장벽.
cache:
  redis:
    enabled: ${CACHE_REDIS_ENABLED:true}

# 매매 안전장치 — 실투자 한도/알림 임계금액
# 환경변수: TRADING_DAILY_BUY_LIMIT_KRW, TRADING_ALERT_THRESHOLD_KRW
trading:
  daily-buy-limit-krw: ${TRADING_DAILY_BUY_LIMIT_KRW:5000000}
  alert-threshold-krw: ${TRADING_ALERT_THRESHOLD_KRW:1000000}

# 봇 리더 선출 — 멀티 인스턴스 중복 실주문 방지(fail-CLOSED). BotLeaderElectionService.
# enabled=true 면 Redis 리스를 잡은 리더 인스턴스만 봇 크론 실주문. Redis 장애 시 주문 중단(fail-closed).
# ⚠ 단일 인스턴스 + Redis 미사용 환경에선 false 로 둬야 봇이 동작(현 단일 인스턴스 전제). 멀티 배포 시 반드시 true.
bot:
  leader-election:
    enabled: ${BOT_LEADER_ELECTION_ENABLED:true}
    lease-ttl-seconds: ${BOT_LEADER_LEASE_TTL_SEC:30}
    heartbeat-ms: ${BOT_LEADER_HEARTBEAT_MS:10000}
  # NXT 연장장 주문 라우팅 (2026-09-14 대비, 기본 OFF). OFF 면 NXT 세션 요청도 REGULAR 로 강등(현행 동일).
  # 활성화 절차: docs/NXT_ROUTING_DESIGN.md §5 (거래소구분 파라미터 확정 → flag ON → 소액 실검증).
  nxt-routing:
    enabled: ${BOT_NXT_ROUTING_ENABLED:false}
  # NXT 방어 청산 재시도 (executeNxtLiquidationRetry, 15:35~19:55). 기본 OFF.
  # nxt-routing.enabled 와 둘 다 ON 이어야 동작 — 정규장 미체결 잔여만 연장세션에서 재청산.
  nxt-liquidation:
    enabled: ${BOT_NXT_LIQUIDATION_ENABLED:false}
  # VKOSPI 변동성 국면 게이트 (V46) — 고변동 장세 봇 신규 진입 사전 회피(서킷브레이커 사후방어 보완).
  # mode 기본 OFF = 게이트 무효(봇 매매 byte-identical). REDUCED=진입 사이즈 50% 축소 / BLOCK=진입 차단.
  # 청산은 항상 허용(비대칭). VKOSPI 데이터 없으면 skip(§4c). VolatilityRegimeService.
  vol-regime-gate:
    mode: ${BOT_VOL_REGIME_GATE_MODE:OFF}          # OFF / REDUCED / BLOCK
  vol-regime:
    lookback-days: ${BOT_VOL_REGIME_LOOKBACK_DAYS:252}   # 백분위 창(거래일)
    top-percent: ${BOT_VOL_REGIME_TOP_PERCENT:10.0}      # 상위 N% 이상이면 HIGH_VOL
    min-samples: ${BOT_VOL_REGIME_MIN_SAMPLES:120}       # 이 미만이면 UNKNOWN(§4c skip)
    reduced-factor: ${BOT_VOL_REGIME_REDUCED_FACTOR:0.5} # REDUCED 모드 사이즈 배수
    unknown-alert-days: ${BOT_VOL_REGIME_UNKNOWN_ALERT_DAYS:3}  # UNKNOWN 연속 N일 → risk 경보 1회(게이트는 fail-open 유지)

# 판정 관제실 (Control Room) — 읽기 전용 조회 + AI 크루 레이어.
# 봇/게이트/가격 경로/신호 합산 코드와 무관하며, 크루에겐 어떤 툴도 주지 않는다.
control-room:
  # 판정 캘린더·FLAGGED·불변식 문서를 읽을 외부 디렉터리(선택).
  # 비우면 jar 안 classpath:control-room/ 을 쓴다 — 운영 기본값(재배포로만 갱신).
  # 서버에서 재배포 없이 문서를 고쳐야 할 때만 볼륨을 마운트하고 이 값을 지정한다.
  docs-dir: ${CONTROL_ROOM_DOCS_DIR:}
  crew:
    # 모델 ID — 하드코딩 금지. 기동 시 GET /v1/models 로 실재 확인하고, 없으면 크루만 DISABLED.
    model: ${CONTROL_ROOM_CREW_MODEL:claude-opus-5}
    # 하루 세션 상한(0 이하=무제한). 초과는 조용히 스킵하지 않고 429 로 거부 → 화면에 "일일 상한 도달".
    daily-limit: ${CONTROL_ROOM_CREW_DAILY_LIMIT:30}
    # 스냅샷 컨텍스트 UTF-8 바이트 상한. 초과 시 FLAGGED 를 중요도 낮은 순으로 잘라내고 "N건 생략" 표기.
    context-limit-bytes: ${CONTROL_ROOM_CREW_CONTEXT_LIMIT_BYTES:8192}
    # 턴당 출력 상한. Opus 5 는 adaptive thinking 이 기본 ON 이라 사고 토큰이 이 예산을 함께 쓴다 —
    # 그래서 effort 를 low 로 낮춘다(안 그러면 사고에 먹혀 본문이 잘린다).
    max-tokens: ${CONTROL_ROOM_CREW_MAX_TOKENS:1000}
    effort: ${CONTROL_ROOM_CREW_EFFORT:low}
    # FIREWALL 검토 턴만 예산·effort 상향 — 불변식 대조가 유일하게 판단 품질이 필요한 턴.
    review-max-tokens: ${CONTROL_ROOM_CREW_REVIEW_MAX_TOKENS:2000}
    review-effort: ${CONTROL_ROOM_CREW_REVIEW_EFFORT:medium}
    # 미설정이면 크루만 비활성(앱 전체는 정상 기동).
    api-key: ${ANTHROPIC_API_KEY:}

# 뉴스 요약 Gemini 일간 호출 상한 — 쿼터 보호
# 초과 시 Gemini 호출 없이 본문 앞부분만 summary 로 저장 (다음날 자동 리셋)
news:
  gemini:
    daily-limit: ${NEWS_GEMINI_DAILY_LIMIT:500}

# WebAuthn (지문/Face ID/패스키) 설정
# 운영: WEBAUTHN_RP_ID=dhkim-lab.duckdns.org, WEBAUTHN_ORIGIN=https://dhkim-lab.duckdns.org
# 개발: localhost 기본값 사용
webauthn:
  rp-id: ${WEBAUTHN_RP_ID:localhost}
  rp-name: ${WEBAUTHN_RP_NAME:MyPlatform}
  origin: ${WEBAUTHN_ORIGIN:http://localhost:5173}
  timeout-ms: 60000

# 7. Swagger - 기본 비활성화. dev 프로필 또는 환경변수 SPRINGDOC_ENABLED=true 로 명시 활성화.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Actuator 글로벌 디폴트 — health + prometheus 노출.
# prometheus 엔드포인트는 호스트 내부에서만 접근 (nginx 에서 /actuator/ 외부 차단).
# JVM 힙/GC, HikariCP pool, Tomcat 스레드, 캐시 히트율, 스케줄러 큐 등 자동 메트릭 제공.
management:
  endpoints:
    # Spring Boot 3.4+ 의 새 access 모델. 4.0 에서 endpoint 의 기본 access 가 적용 안 되면
    # exposure.include 에 명시해도 endpoint 가 매핑 안 됨 → /actuator/health 404.
    access:
      default: read-only
    web:
      exposure:
        include: health,prometheus,metrics,info
  endpoint:
    health:
      show-details: never
      show-components: never
      access: read-only
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}

# 8. Resilience4j — 외부 API 회복성.
# CircuitBreaker: 슬라이딩 윈도우에서 실패율 초과 → OPEN(차단) → 일정 시간 후 HALF_OPEN(시도)
# Retry: 일시적 IO/timeout 에 자동 재시도. KIS rate limit (5 req/sec) 고려해 짧은 백오프.
resilience4j:
  circuitbreaker:
    instances:
      kisApi:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50         # 실패 50% 이상이면 OPEN
        slowCallRateThreshold: 70
        slowCallDurationThreshold: 5s
        waitDurationInOpenState: 30s     # OPEN 유지 30초 후 HALF_OPEN
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true
      geminiApi:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 60         # AI 호출은 더 관대 (Gemini 자체 rate limit 있음)
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 2
        registerHealthIndicator: true
      dartApi:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 2
        registerHealthIndicator: true
  retry:
    instances:
      kisApi:
        maxAttempts: 3
        waitDuration: 300ms
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - java.lang.IllegalArgumentException

# 9. Sentry — 보류. Spring Boot 4.x 호환 버전 출시 후 재활성.
