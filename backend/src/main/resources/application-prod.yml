server:
  port: 8080
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: update # TODO: prod DB 스키마 드리프트 정리 후 validate 로 복구 (diet_record 누락 이슈)
    show-sql: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  level:
    root: WARN
    com.myplatform: INFO
    org.flywaydb: INFO                  # 마이그레이션 진행 가시성 확보
    org.hibernate.tool.schema: INFO     # ddl-auto 동작/스키마 검증 로그 노출