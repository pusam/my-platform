server:
  port: 8080
  # nginx 가 X-Forwarded-Proto/For 를 보내도록 설정돼 있으므로 신뢰한다.
  # 이 설정이 있어야 isSecure(), HSTS, 정확한 클라이언트 IP가 동작한다.
  forward-headers-strategy: native
  # 에러 응답에 stacktrace / 내부 메시지 / 바인딩 에러 노출 금지 (정보 누출 방지)
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false
  # 헤더 사이즈 제한 (Slowloris/Header bomb 완화)
  max-http-request-header-size: 16KB
  servlet:
    session:
      timeout: 30m
      cookie:
        secure: true        # HTTPS 에서만 전송
        http-only: true     # JS 접근 차단 (XSS 시 탈취 방지)
        same-site: strict   # 크로스사이트 요청 시 쿠키 미전송
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      # Flyway 로 스키마 관리 정상화 + V16 고아 테이블 정리 완료 후 validate 로 복귀.
      # 이후 스키마 변경은 모두 V17+ Flyway 마이그레이션으로 적용.
      ddl-auto: validate
    show-sql: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
# Actuator: health + prometheus 노출. prometheus 는 nginx 외부 차단.
# 이전: exclude: "*" 가 include 보다 우선이라 모든 endpoint 차단됨 → /actuator/health 404.
# Spring Boot 3.4+ 에서 endpoint 매핑은 access 모델도 함께 명시해야 함.
management:
  endpoints:
    access:
      default: read-only
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      access: read-only
    prometheus:
      access: unrestricted
  info:
    env:
      enabled: false
logging:
  level:
    root: WARN
    com.myplatform: INFO
    org.flywaydb: INFO                  # 마이그레이션 진행 가시성 확보
    org.hibernate.tool.schema: INFO     # ddl-auto 동작/스키마 검증 로그 노출