server:
  port: 8080
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      # Flyway 로 스키마 관리 정상화 + V16 고아 테이블 정리 완료 후 validate 로 복귀.
      # 이후 스키마 변경은 모두 V17+ Flyway 마이그레이션으로 적용.
      ddl-auto: validate
    show-sql: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  level:
    root: WARN
    com.myplatform: INFO
    org.flywaydb: INFO                  # 마이그레이션 진행 가시성 확보
    org.hibernate.tool.schema: INFO     # ddl-auto 동작/스키마 검증 로그 노출