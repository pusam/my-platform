# =============================================================================
# 놀자 (nolja.dhkim-lab.duckdns.org) — my-platform nginx 동거 server 블록
#
# 조이콘으로 하는 가족 게임 모음(테니스·카트·볼링). 서버 코드 없이 정적 파일만 서빙한다.
#   정적: /usr/share/nginx/nolja  (./nginx/nolja-dist 마운트, html 바깥 형제 경로)
#   채우는 쪽: 서버 크론(/home/dev/nolja/sync.sh, 5분마다)이 공개 저장소 pusam/nolja 의 main 을 받아
#             index.html · games/ · shared/ 만 풀어 넣는다(rsync --delete, 폴더 inode 유지). 이 저장소 배포와 무관.
#
# 왜 HTTPS 여야 하나: 조이콘 연결(WebHID)은 보안 출처(HTTPS·localhost)에서만 된다 — 집 안 http://<IP> 로는 막힌다.
# 도메인: dhkim-lab.duckdns.org 의 하위 이름이라 DuckDNS 에 따로 등록하지 않아도 같은 IP 로 풀린다(DuckDNS 와일드카드).
# 인증서: ./nginx/ssl/live/nolja.dhkim-lab.duckdns.org/{fullchain,privkey}.pem
#     없는 인증서를 참조하면 nginx 가 못 떠서 다른 사이트까지 내려간다. 그래서 배포(deploy.yml Copy 단계)의
#     scripts/ensure-site-cert.sh 가 nginx -t 전에 webroot 로 발급하고, 발급이 안 되면 그 배포 동안 이 파일을 끈다.
#     갱신은 certbot 컨테이너(12시간마다 certbot renew)가 다른 인증서와 함께 한다.
# 포트 80(ACME 챌린지 + HTTPS 리다이렉트)은 default.conf 의 default_server 가 모든 호스트에 대해 처리한다.
# =============================================================================

server {
    listen 443 ssl;
    http2 on;
    server_name nolja.dhkim-lab.duckdns.org;

    ssl_certificate     /etc/nginx/ssl/live/nolja.dhkim-lab.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/nolja.dhkim-lab.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/nolja;
    index index.html;

    # ----- 보안 헤더 (jewelry.conf 와 같은 프로필) -----
    # ⚠️ location 안에 add_header 를 한 줄이라도 쓰면 그 location 에서 이 server 의 add_header 가 전부 버려진다.
    #    캐시는 location 에서 add_header 대신 expires 로 준다.
    # CSP — 외부 자원 없음(글꼴·three.js 모두 자체). 홈 화면에 인라인 스크립트 1개 · 메뉴 칸 innerHTML 에 style 속성 ·
    #        캐릭터 그림 toDataURL(data: 이미지). Permissions-Policy 는 두지 않는다 — 기본값이 자기 출처의 WebHID(조이콘)·
    #        게임패드·전체화면을 허용한다(끄면 조이콘이 안 붙는다).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ----- gzip (three.min.js 600KB → 약 150KB) -----
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 숨김 파일(.git 등)은 막는다 — 크론이 git 저장소째가 아니라 파일만 풀어 넣지만 혹시를 위해
    location ~ /\. { deny all; access_log off; log_not_found off; }

    # 화면(HTML)은 매번 재검증 — 새 ?v= 가 바로 보이게. js·css 는 주소 끝 ?v=날짜 로 바뀌므로 하루 캐시해도 된다
    location ~* \.html$ {
        expires -1;
    }
    location ~* \.(?:js|css|png|webp|jpg|svg|ico)$ {
        expires 1d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
