# =============================================================================
# jewelry-leads (vorj-map.duckdns.org) — my-platform nginx 동거 server 블록
#
# my-platform default.conf(dhkim-lab.duckdns.org) 와 별개의 443 server 블록.
# 같은 nginx 가 SNI(server_name)로 두 도메인을 구분해 각각 다른 백엔드/정적으로 라우팅.
#
# ⚠️ 반영 순서(중요): 이 파일이 nginx 에 로드되기 전에 반드시 vorj-map 인증서가 있어야 함:
#       ./nginx/ssl/live/vorj-map.duckdns.org/{fullchain,privkey}.pem
#     없으면 nginx 가 부팅 실패 → my-platform 사이트까지 다운.
#     (반드시 2단계: ① 인증서 발급  →  ② 이 파일 반영 + nginx 재기동)
#
#   정적: /usr/share/nginx/jewelry  (jewelry-leads/frontend/dist 마운트, html 바깥 형제 경로)
#   API : http://jewelry-leads-backend:8083  (myplatform-network 공유)
#
# 포트 80(ACME 챌린지 + HTTPS 리다이렉트)은 default.conf 의 default_server 가
# 모든 호스트에 대해 이미 처리하므로 여기선 443 만 정의한다.
# =============================================================================

server {
    listen 443 ssl;
    http2 on;
    server_name vorj-map.duckdns.org;

    ssl_certificate     /etc/nginx/ssl/live/vorj-map.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/vorj-map.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/jewelry;
    index index.html;

    # ----- 보안 헤더 (default.conf 와 동일 프로필) -----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP — Vue 빌드물(인라인) + 지도/외부 이미지/웹푸시 허용
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    client_max_body_size 300M;

    # ----- gzip -----
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf application/wasm;

    # ----- Java API → jewelry-leads-backend:8083 -----
    # resolver + 변수 방식: backend 컨테이너가 아직 안 떠 있어도 nginx 는 정상 부팅.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jewelry_backend http://jewelry-leads-backend:8083;
        proxy_pass $jewelry_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # 파일 업로드(사진) — 무작위 해시 경로, GET permitAll
    location /api/files/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jewelry_backend2 http://jewelry-leads-backend:8083;
        proxy_pass $jewelry_backend2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ===== MCP 서버 (읽기 전용, claude.ai 커스텀 커넥터) =====
    # 상세: jewelry-leads 저장소의 docs/MCP_SERVER.md
    #
    # /mcp 응답은 SSE 프레이밍(text/event-stream)으로도 나간다.
    # proxy_buffering 을 끄지 않으면 응답이 버퍼에 갇혀 커넥터가 멈춘다.
    location /mcp {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jewelry_mcp http://jewelry-leads-backend:8083;
        proxy_pass $jewelry_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # OAuth 2.1 인증서버 — authorize / token / jwks / register(DCR) / login 이 모두
    # 이 접두사 아래에 있다. 로그인 화면 경로를 /oauth2/login 으로 둔 이유가 이것이다
    # (SPA 의 /login 과도 겹치지 않는다).
    location /oauth2/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jewelry_oauth http://jewelry-leads-backend:8083;
        proxy_pass $jewelry_oauth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 디스커버리 메타데이터 — RFC 규정상 도메인 루트에 있어야 한다.
    # exact match(=) 라 아래 SPA fallback(location /) 보다 항상 먼저 잡힌다.
    # 이게 index.html 로 흘러가면 커넥터가 인증서버를 못 찾아 연결이 시작되지 않는다.
    location = /.well-known/oauth-protected-resource {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jewelry_meta1 http://jewelry-leads-backend:8083;
        proxy_pass $jewelry_meta1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /.well-known/oauth-authorization-server {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jewelry_meta2 http://jewelry-leads-backend:8083;
        proxy_pass $jewelry_meta2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # actuator 외부 차단
    location /actuator { return 404; }

    # 정적 캐싱
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }
    # service worker 는 캐시 금지(즉시 갱신)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ~ /(\.env|\.git|\.svn) { deny all; access_log off; log_not_found off; }

    # SPA 라우팅 (공개 링크 /q /lookbook /statement, 포털 /portal 포함)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
