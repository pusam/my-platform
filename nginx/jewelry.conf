# =============================================================================
# jewelry-leads (vorj-map.duckdns.org) — my-platform nginx 동거 server 블록
#
# my-platform default.conf(dhkim-lab.duckdns.org) 와 별개의 443 server 블록.
# 같은 nginx 가 SNI(server_name)로 두 도메인을 구분해 각각 다른 백엔드/정적으로 라우팅.
#
# ⚠️ 반영 순서(중요): 이 파일이 nginx 에 로드되기 전에 반드시 vorj-map 인증서가 있어야 함:
#       ./nginx/ssl/live/vorj-map.duckdns.org/{fullchain,privkey}.pem
#     없으면 nginx 가 부팅 실패 → my-platform 사이트까지 다운.
#     (반드시 2단계: ① 인증서 발급  →  ② 이 파일 반영 + nginx 재기동)
#
#   정적: /usr/share/nginx/jewelry  (jewelry-leads/frontend/dist 마운트, html 바깥 형제 경로)
#   API : http://jewelry-leads-backend:8083  (myplatform-network 공유)
#
# 포트 80(ACME 챌린지 + HTTPS 리다이렉트)은 default.conf 의 default_server 가
# 모든 호스트에 대해 이미 처리하므로 여기선 443 만 정의한다.
# =============================================================================

server {
    listen 443 ssl;
    http2 on;
    server_name vorj-map.duckdns.org;

    ssl_certificate     /etc/nginx/ssl/live/vorj-map.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/vorj-map.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/jewelry;
    index index.html;

    # ----- 보안 헤더 (default.conf 와 동일 프로필) -----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP — Vue 빌드물(인라인) + 지도/외부 이미지/웹푸시 허용
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    client_max_body_size 300M;

    # ----- gzip -----
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf application/wasm;

    # ----- Java API → jewelry-leads-backend:8083 -----
    # resolver + 변수 방식: backend 컨테이너가 아직 안 떠 있어도 nginx 는 정상 부팅.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jewelry_backend http://jewelry-leads-backend:8083;
        proxy_pass $jewelry_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # 파일 업로드(사진) — 무작위 해시 경로, GET permitAll
    location /api/files/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jewelry_backend2 http://jewelry-leads-backend:8083;
        proxy_pass $jewelry_backend2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ===== MCP 서버 (읽기 전용, claude.ai 커스텀 커넥터) =====
    # 상세: jewelry-leads 저장소의 docs/MCP_SERVER.md
    #
    # /mcp 응답은 SSE 프레이밍(text/event-stream)으로도 나간다.
    # proxy_buffering 을 끄지 않으면 응답이 버퍼에 갇혀 커넥터가 멈춘다.
    location /mcp {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jewelry_mcp http://jewelry-leads-backend:8083;
        proxy_pass $jewelry_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # OAuth 2.1 인증서버 — authorize / token / jwks / register(DCR) / login 이 모두
    # 이 접두사 아래에 있다. 로그인 화면 경로를 /oauth2/login 으로 둔 이유가 이것이다
    # (SPA 의 /login 과도 겹치지 않는다).
    location /oauth2/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jewelry_oauth http://jewelry-leads-backend:8083;
        proxy_pass $jewelry_oauth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 디스커버리 메타데이터 — RFC 규정상 도메인 루트에 있어야 한다.
    # exact match(=) 라 아래 SPA fallback(location /) 보다 항상 먼저 잡힌다.
    # 이게 index.html 로 흘러가면 커넥터가 인증서버를 못 찾아 연결이 시작되지 않는다.
    location = /.well-known/oauth-protected-resource {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jewelry_meta1 http://jewelry-leads-backend:8083;
        proxy_pass $jewelry_meta1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /.well-known/oauth-authorization-server {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jewelry_meta2 http://jewelry-leads-backend:8083;
        proxy_pass $jewelry_meta2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # actuator 외부 차단
    location /actuator { return 404; }

    # 정적 캐싱
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }
    # service worker 는 캐시 금지(즉시 갱신)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ~ /(\.env|\.git|\.svn) { deny all; access_log off; log_not_found off; }

    # SPA 라우팅 (공개 링크 /q /lookbook /statement, 포털 /portal 포함)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =============================================================================
# 주얼리 영업 연습 (jewelry-sim.duckdns.org) — 별도 프로젝트, 같은 nginx
#
# ⚠️ 이 파일이 원본이다 — 서버에서 직접 고치면 다음 my-platform 배포가 되돌린다.
#    deploy 워크플로가 nginx/jewelry.conf 를 서버로 그대로 scp 한다. 2026-09-11 에
#    서버에서만 이 블록을 덧붙였다가 배포 한 번에 sim 사이트가 죽었다(원인: 여기 없었음).
#
# 왜 sim 블록이 jewelry.conf 안에 같이 있나: nginx 컨테이너가 conf.d 디렉터리가 아니라
# <b>파일을 하나씩</b> 마운트한다(docker inspect myplatform-nginx). 새 .conf 를 추가하려면
# docker-compose.yml 을 고치고 nginx 를 재생성해야 하고, 그때 설정이 틀리면 nginx 가
# 뜨지 못해 <b>두 사이트가 같이 죽는다</b>. 이미 마운트된 이 파일에 덧붙이면
# `nginx -t` + reload 로 끝나고, reload 는 실패해도 기존 설정이 그대로 남는다.
#
# 인증서: /etc/nginx/ssl/live/jewelry-sim.duckdns.org/  (2026-09-11 발급, certbot 컨테이너가 갱신)
#
# ⚠️ 반영 순서(vorj-map 과 같다): 이 블록이 nginx 에 로드되기 전에 반드시 인증서가 있어야 한다.
#    없으면 nginx 가 부팅 실패 → my-platform·jewelry 까지 전부 다운. 서버를 새로 세우는
#    경우라면 ① 인증서 발급 → ② 이 블록 반영 순서를 지킨다:
#      docker run --rm -v /home/dev/my-platform/nginx/ssl:/etc/letsencrypt #        -v /home/dev/my-platform/nginx/certbot-webroot:/var/www/certbot #        certbot/certbot certonly --webroot -w /var/www/certbot #        -d jewelry-sim.duckdns.org --non-interactive --agree-tos -m <메일>
# 백엔드: http://jewelry-sim:8790  (~/jewelry-sales-sim/docker-compose.yml, 같은 myplatform-network)
#
# 앱 자체에 비밀번호 한 겹이 있다(server/auth.mjs) — 구독 자격증명으로 모델을 부르는
# 서버라 문이 열려 있으면 안 된다. nginx 는 그대로 흘려보내고 판단은 앱이 한다.
# 포트 80 은 default.conf 의 default_server 가 ACME·리다이렉트를 이미 처리한다.
# =============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name jewelry-sim.duckdns.org;

    ssl_certificate     /etc/nginx/ssl/live/jewelry-sim.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/jewelry-sim.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # three.js 는 번들로 들어가 있어 외부 스크립트가 없다. 캔버스 텍스처 때문에 blob: 를 연다.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    client_max_body_size 2M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        # resolver + 변수 방식: sim 컨테이너가 아직 안 떠 있어도 nginx 는 정상 부팅한다.
        # (이름을 직접 쓰면 기동 시 해석에 실패해 nginx 가 통째로 죽는다)
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $sim_backend http://jewelry-sim:8790;
        proxy_pass $sim_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 코치 채점은 한 번에 수십 초가 걸린다(모델이 긴 JSON 을 쓴다). 기본 60초면 잘린다.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }
}
