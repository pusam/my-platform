# =============================================================================
# my-platform nginx 설정
# - 80: ACME(Let's Encrypt) 챌린지 처리 + HTTPS 강제 리다이렉트
# - 443: HTTPS + 보안 헤더 + 백엔드 프록시
# 인증서 경로: /etc/nginx/ssl/live/<도메인>/{fullchain,privkey}.pem
# =============================================================================

# ---------- HTTP (포트 80) ----------
# 인증서 갱신용 ACME 챌린지만 통과시키고, 나머지는 모두 HTTPS 로 영구 이전.
server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt 갱신 챌린지
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 그 외 모든 요청은 HTTPS 로
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS (포트 443) ----------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ----- TLS -----
    ssl_certificate     /etc/nginx/ssl/live/dhkim-lab.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/dhkim-lab.duckdns.org/privkey.pem;

    # 모던 프로필 (TLS 1.2+ only). 0-RTT 비활성, 세션 캐시 재사용.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling (인증서 유효성 캐싱)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    # ----- 보안 헤더 -----
    # HSTS: 1년 + 서브도메인 포함. 실서비스 안정화 후 preload 추가 권장.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # 보수적 CSP — 인라인 스크립트/스타일은 허용 (Vue 빌드물 호환). 외부 SDK 추가 시 도메인 명시.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # nginx 버전 / 백엔드 헤더 노출 차단
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    client_max_body_size 300M;

    # ----- 라우팅 -----

    # SSE (Server-Sent Events) — 장시간 연결
    location /api/sse/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Python V2 API
    location /api/v2/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_python http://python-backend:8000;
        proxy_pass $upstream_python;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 30s;
    }

    # 로그인/회원가입 — nginx 단에서 한 번 더 IP 제한 (Java RateLimitFilter 와 이중 방어)
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_conn conn_per_ip 20;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/signup {
        limit_req zone=signup_zone burst=2 nodelay;
        limit_conn conn_per_ip 20;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Java API
    location /api/ {
        limit_conn conn_per_ip 50;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # Actuator 차단 (외부에서는 health 도 직접 노출하지 않음)
    location /actuator {
        return 404;
    }

    # 정적 파일 캐싱
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 캐시 금지
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 숨김 파일 / 흔한 정탐 경로 차단
    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
    location ~ /(\.env|\.git|\.svn|wp-admin|wp-login\.php|phpmyadmin) {
        deny all; access_log off; log_not_found off;
    }

    # SPA 클라이언트 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }
}
