# =============================================================================
# news-shorts-factory (nsf-news.dhkim-lab.duckdns.org) — my-platform nginx 동거 server 블록
#
# 뉴스 쇼츠 관리자(news-shorts-factory)의 프론트 컨테이너 nsf-frontend:80 으로 전부 프록시한다.
# nsf-frontend 가 화면(정적)과 /api(→ 내부 API)를 함께 서빙하므로, 여기서는 TLS·HSTS·로그인 속도 제한만 맡는다.
# 보안 헤더(CSP·X-Frame-Options 등)는 nsf-frontend 가 붙인다 — 여기서 CSP 를 또 붙이면 두 정책이 겹쳐 화면이 깨질 수
# 있어 HSTS 만 더한다. (location 안에 add_header 를 쓰면 server 의 add_header 가 버려지므로 location 에는 쓰지 않는다.)
#
# 도메인: dhkim-lab.duckdns.org 의 하위 이름이라 DuckDNS 에 따로 등록하지 않아도 같은 IP 로 풀린다(DuckDNS 와일드카드).
# 인증서: ./nginx/ssl/live/nsf-news.dhkim-lab.duckdns.org/{fullchain,privkey}.pem
#     없는 인증서를 참조하면 nginx 가 못 떠서 my-platform 사이트까지 내려간다. 그래서 배포(deploy.yml Copy 단계)의
#     scripts/ensure-site-cert.sh 가 nginx -t 전에 webroot 로 발급하고, 발급이 안 되면 그 배포 동안 이 파일을 끈다.
#     갱신은 certbot 컨테이너(12시간마다 certbot renew)가 다른 인증서와 함께 한다.
#
#   대상: http://nsf-frontend:80  (myplatform-network 공유 — news-shorts-factory/docker-compose.prod.yml)
#   진짜 접속 주소: X-Real-IP 로 넘기면 nsf-frontend 가 Docker 사설 대역에서 온 값만 믿고 API 로 이어 준다
#   (뉴스 앱도 주소당 15분 10회 로그인 실패 시 잠근다 — 아래 login_zone 과 이중 방어).
# =============================================================================

server {
    listen 443 ssl;
    http2 on;
    server_name nsf-news.dhkim-lab.duckdns.org;

    ssl_certificate     /etc/nginx/ssl/live/nsf-news.dhkim-lab.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/nsf-news.dhkim-lab.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    proxy_hide_header X-Powered-By;

    # 관리자 업로드(사진 12MB · 1차 자료 원본 19MB) — nsf-frontend 도 20m 로 막는다
    client_max_body_size 20m;

    # 로그인 — my-platform 과 같은 login_zone(주소당 분당 10회) + 동시 연결 제한
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_conn conn_per_ip 20;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $nsf_frontend http://nsf-frontend:80;
        proxy_pass $nsf_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 그 밖에 전부(화면 · API · 서명된 영상/이미지). resolver + 변수: nsf-frontend 가 안 떠 있어도 nginx 는 부팅한다.
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $nsf_frontend http://nsf-frontend:80;
        proxy_pass $nsf_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 영상 미리보기 탐색(Range) · 렌더 요청 · 업로드가 길 수 있다
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
