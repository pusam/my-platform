# =============================================================================
# seah (seah.duckdns.org) — my-platform nginx 동거 server 블록
#
# 원본은 seah 저장소의 deploy/nginx/seah.conf 이며, 이 파일은 그 사본이다.
# 수정할 일이 있으면 양쪽을 같이 맞춘다. (jewelry.conf 와 같은 동거 패턴 — 상세는 seah/DEPLOY.md)
#
# ⚠️ 도메인 확정 전 주의: seah.duckdns.org 가 선점되어 다른 이름을 잡았다면
#    server_name + 인증서 경로 2줄 + deploy.yml 의 seah 인증서 가드 경로를 같이 바꿀 것.
#
# my-platform default.conf(dhkim-lab.duckdns.org) 와 별개의 443 server 블록.
# 같은 nginx 가 SNI(server_name)로 도메인을 구분해 각각 다른 백엔드/정적으로 라우팅한다.
#
# ⚠️ 반영 순서(중요): 이 파일이 nginx 에 로드되기 전에 반드시 seah 인증서가 있어야 한다:
#       ./nginx/ssl/live/seah.duckdns.org/{fullchain,privkey}.pem
#     없으면 nginx 가 부팅 실패 → my-platform·jewelry 사이트까지 전부 다운.
#     (반드시 2단계: ① 인증서 발급  →  ② 이 파일 반영 + nginx 재기동)
#
#   정적: /usr/share/nginx/seah  (seah/frontend/dist 마운트, html 바깥 형제 경로)
#   API : http://seah-backend:8084  (myplatform-network 공유)
#
# 포트 80(ACME 챌린지 + HTTPS 리다이렉트)은 default.conf 의 default_server 가
# 모든 호스트에 대해 이미 처리하므로 여기선 443 만 정의한다.
# =============================================================================

server {
    listen 443 ssl;
    http2 on;
    server_name seah.duckdns.org;

    ssl_certificate     /etc/nginx/ssl/live/seah.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/seah.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/seah;
    index index.html;

    # ----- 보안 헤더 (default.conf 와 동일 프로필) -----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP — React 빌드물(인라인) + 외부 이미지/웹푸시/SSE 허용.
    # 'unsafe-eval' 은 mermaid(위키·본문 다이어그램) 가 필요로 한다. 위키를 걷어내면 빼도 된다.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # 첨부파일 업로드 상한(백엔드 multipart 는 25MB) 보다 넉넉하게
    client_max_body_size 100M;

    # ----- gzip -----
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf application/wasm;

    # ----- SSE (실시간 보드 동기화) -----
    # ⚠️ 반드시 /api/ 블록보다 먼저 와야 한다(정규식 location 이 prefix 보다 우선하지만
    #    의도를 분명히 하기 위해 위에 둔다). 버퍼링을 끄지 않으면 이벤트가 nginx 에 고여
    #    보드가 실시간으로 갱신되지 않고, read timeout 때문에 연결이 주기적으로 끊긴다.
    #    백엔드 SseEmitter 타임아웃이 30분이므로 read timeout 을 그보다 길게 잡는다.
    location ~ ^/api/(projects|spaces|members)/[0-9]+/events$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $seah_sse http://seah-backend:8084;
        proxy_pass $seah_sse;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ----- Java API → seah-backend:8084 -----
    # resolver + 변수 방식: backend 컨테이너가 아직 안 떠 있어도 nginx 는 정상 부팅한다.
    # (컨테이너명을 proxy_pass 에 직접 쓰면 미기동 시 nginx 부팅 실패 → 전체 사이트 다운)
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $seah_backend http://seah-backend:8084;
        proxy_pass $seah_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # actuator 외부 차단 (컨테이너 헬스체크는 도커 네트워크 내부에서만 호출)
    location /actuator { return 404; }

    # swagger 외부 차단
    location /swagger-ui { return 404; }
    location /v3/api-docs { return 404; }

    # 정적 캐싱
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }
    # service worker 는 캐시 금지(즉시 갱신)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /push-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ~ /(\.env|\.git|\.svn) { deny all; access_log off; log_not_found off; }

    # SPA 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }
}
