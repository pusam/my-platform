# =============================================================================
# Content Factory (content-factory.dhkim-lab.duckdns.org) — my-platform nginx 동거 server 블록
#
# Content Factory 관리자(content-factory 저장소)의 프론트 컨테이너 cf-frontend:80 으로 전부 프록시한다.
# cf-frontend 가 화면(정적) · /api(→ 내부 API) · /r/(추적 링크 리디렉트)를 함께 서빙하므로, 여기서는 TLS·HSTS·속도
# 제한만 맡는다. 보안 헤더(CSP·X-Frame-Options 등)는 cf-frontend 가 붙인다 — 여기서 CSP 를 또 붙이면 두 정책이 겹쳐
# 화면이 깨질 수 있어 HSTS 만 더한다. (location 안에 add_header 를 쓰면 server 의 add_header 가 버려지므로 쓰지 않는다.)
#
# 로그인 없이 열리는 경로는 둘뿐이다: /r/{shortcode}(저장된 목적지로만 302) · /api/webhooks/conversions/{provider}
# (서명 검증). 나머지 화면·API 는 관리자 로그인이 필요하다.
#
# 도메인: dhkim-lab.duckdns.org 의 하위 이름이라 DuckDNS 에 따로 등록하지 않아도 같은 IP 로 풀린다(DuckDNS 와일드카드).
# 인증서: ./nginx/ssl/live/content-factory.dhkim-lab.duckdns.org/{fullchain,privkey}.pem
#     없는 인증서를 참조하면 nginx 가 못 떠서 my-platform 사이트까지 내려간다. 그래서 배포(deploy.yml Copy 단계)의
#     scripts/ensure-site-cert.sh 가 nginx -t 전에 webroot 로 발급하고, 발급이 안 되면 그 배포 동안 이 파일을 끈다.
#     갱신은 certbot 컨테이너(12시간마다 certbot renew)가 다른 인증서와 함께 한다.
#
#   대상: http://cf-frontend:80  (myplatform-network 공유 — content-factory/docker-compose.prod.yml)
#   cf-frontend 가 아직 없어도(Content Factory 배포 전) resolver + 변수 proxy_pass 라 nginx 는 부팅하고 이 사이트만 502.
# =============================================================================

server {
    listen 443 ssl;
    http2 on;
    server_name content-factory.dhkim-lab.duckdns.org;

    ssl_certificate     /etc/nginx/ssl/live/content-factory.dhkim-lab.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/content-factory.dhkim-lab.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    proxy_hide_header X-Powered-By;

    # 관리자 업로드(사진 12MB · 1차 자료 원본 19MB · CSV 2MB) — cf-frontend 도 20m 로 막는다
    client_max_body_size 20m;

    # 로그인 — my-platform 과 같은 login_zone(주소당 분당 10회) + 동시 연결 제한
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_conn conn_per_ip 20;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cf_frontend http://cf-frontend:80;
        proxy_pass $cf_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 추적 링크 리디렉트(공개) — 저장된 목적지로만 302 를 돌려준다. 주소당 동시 연결만 묶는다(정상 클릭을 막지 않게).
    location /r/ {
        limit_conn conn_per_ip 20;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cf_frontend http://cf-frontend:80;
        proxy_pass $cf_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # 그 밖에 전부(화면 · API · 서명된 영상/이미지). resolver + 변수: cf-frontend 가 안 떠 있어도 nginx 는 부팅한다.
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cf_frontend http://cf-frontend:80;
        proxy_pass $cf_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 영상 미리보기 탐색(Range) · 렌더 요청 · 업로드가 길 수 있다
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
