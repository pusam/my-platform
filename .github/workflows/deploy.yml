name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # ================================================================
  # Frontend Build (병렬 실행)
  # ================================================================
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ================================================================
  # Backend Build (병렬 실행)
  # ================================================================
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run backend tests
        run: |
          chmod +x gradlew
          ./gradlew :backend:test -PskipFrontend

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/
          retention-days: 7

      # 실제 MariaDB(Testcontainers) 상에서 Flyway 마이그레이션 전체 적용을 검증.
      # 별도 step 으로 분리 — 실패 시 "어느 게이트에서 막혔는지" 로그에서 즉시 식별.
      # ubuntu-latest 러너는 Docker 사전 설치 → DinD 불필요. 이 step 실패 시 build-backend 잡이
      # 실패하고 deploy 잡(needs: build-backend)이 실행되지 않아 SSH 배포에 도달하지 못한다.
      - name: Run Flyway migration test (Testcontainers MariaDB)
        run: ./gradlew :backend:migrationTest -PskipFrontend

      - name: Upload migration test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-migration-test-reports
          path: backend/build/reports/tests/
          retention-days: 7

      - name: Build with Gradle
        run: ./gradlew bootJar -x test -PskipFrontend

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*.jar
          retention-days: 1

  # ================================================================
  # Python Backend Build (병렬 실행)
  # ================================================================
  build-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Python image
        uses: docker/build-push-action@v5
        with:
          context: ./python-backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-python:prod
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/my-python:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/my-python:buildcache,mode=max

  # ================================================================
  # Deploy (Frontend + Backend 완료 후 실행)
  # ================================================================
  deploy:
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend, build-python]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./

      - name: Prepare JAR file
        run: |
          JAR_FILE=$(find . -name "*.jar" -not -name "*plain*" -not -path "*/gradle/*" -size +1M | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "❌ ERROR: Spring Boot JAR not found!"
            find . -name "*.jar" -ls
            exit 1
          fi
          echo "✅ Found JAR: $JAR_FILE ($(du -h "$JAR_FILE" | cut -f1))"
          mv "$JAR_FILE" app.jar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-server:prod
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/my-server:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/my-server:buildcache,mode=max

      # ================================================================
      # 서버 배포 (단일 환경)
      # ================================================================
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.KEY_DEV }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "StrictHostKeyChecking no" > ~/.ssh/config
          echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config
          echo "LogLevel ERROR" >> ~/.ssh/config

      - name: Copy files to server
        run: |
          HOST="${{ secrets.HOST_DEV }}"
          USER="${{ secrets.USERNAME_DEV }}"
          PORT="${{ secrets.PORT }}"
          TARGET="/home/dev/my-platform"
          SSH_CMD="ssh -p $PORT -i ~/.ssh/deploy_key"
          SCP_CMD="scp -P $PORT -i ~/.ssh/deploy_key"

          echo "📦 파일 전송: $HOST:$PORT → $TARGET"

          # 타겟 디렉토리 생성 (인증서 + jewelry dist 디렉토리 포함 — dev 소유로 미리 생성)
          $SSH_CMD "$USER@$HOST" "mkdir -p $TARGET/nginx $TARGET/frontend $TARGET/scripts $TARGET/nginx/ssl $TARGET/nginx/certbot-webroot $TARGET/nginx/jewelry-dist"

          # docker-compose.yml + nginx 전체 설정 (jewelry.conf 포함)
          $SCP_CMD docker-compose.yml "$USER@$HOST:$TARGET/"
          $SCP_CMD nginx/default.conf "$USER@$HOST:$TARGET/nginx/default.conf"
          $SCP_CMD nginx/nginx.conf "$USER@$HOST:$TARGET/nginx/nginx.conf"
          # jewelry(vorj-map) 동거 server 블록 — 있으면 전송
          [ -f nginx/jewelry.conf ] && $SCP_CMD nginx/jewelry.conf "$USER@$HOST:$TARGET/nginx/jewelry.conf" || true

          # 운영 스크립트 (init-https / harden-server)
          $SCP_CMD scripts/*.sh "$USER@$HOST:$TARGET/scripts/"
          $SSH_CMD "$USER@$HOST" "chmod +x $TARGET/scripts/*.sh"

          # frontend/dist — 내용물만 교체(디렉토리 inode 유지)해 nginx 바인드 마운트 stale 방지.
          #   'rm -rf dist'(디렉토리 통째 교체=inode 변경)는 nginx 가 옛 inode 를 붙들어 하드리로드 404 유발
          #   (인증서/nginx -t 게이트 early-exit 로 아래 --force-recreate nginx 가 스킵되면 특히).
          #   jewelry-leads 배포(jewelry-dist)와 동일한 검증된 패턴: 'rm -rf dir/* && tar -xzf -C dir'.
          tar -czf /tmp/frontend-dist.tar.gz -C frontend/dist .
          $SCP_CMD /tmp/frontend-dist.tar.gz "$USER@$HOST:/tmp/"
          $SSH_CMD "$USER@$HOST" "mkdir -p $TARGET/frontend/dist && rm -rf $TARGET/frontend/dist/* && tar -xzf /tmp/frontend-dist.tar.gz -C $TARGET/frontend/dist && rm /tmp/frontend-dist.tar.gz"

          # ★ nginx 바인드 마운트를 새 dist 에 무조건 재바인드 — inode 보존이 실패하거나(디렉토리 교체)
          #   아래 Deploy 단계의 nginx 재생성이 인증서/nginx -t 게이트로 스킵돼도, 이 재시작이 항상 재바인드하므로
          #   하드리로드 404 를 원천 차단한다. nginx 는 이미 떠 있고(인증서 有) resolver 배선(26ef314)이
          #   backend IP 재해석을 담당하므로 안전. 실패해도 배포는 계속(|| true).
          $SSH_CMD "$USER@$HOST" "docker restart myplatform-nginx || true"

          echo "✅ 파일 전송 완료 + nginx 재바인드"

      - name: Deploy to Server
        run: |
          HOST="${{ secrets.HOST_DEV }}"
          USER="${{ secrets.USERNAME_DEV }}"
          PORT="${{ secrets.PORT }}"

          ssh -p "$PORT" -i ~/.ssh/deploy_key "$USER@$HOST" << 'DEPLOY_EOF'
            set -e
            cd /home/dev/my-platform

            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            echo "🚀 배포 시작"

            docker pull "${{ secrets.DOCKER_USERNAME }}/my-server:prod"
            docker pull "${{ secrets.DOCKER_USERNAME }}/my-python:prod"

            # 백엔드/파이썬은 안전하게 재기동
            docker compose up -d --force-recreate --no-deps backend python-backend

            # nginx 재기동 전 SSL 인증서 존재 확인.
            # 없으면 nginx 가 부팅 실패 → 사이트 다운. 미리 차단하고 안내.
            CERT="./nginx/ssl/live/dhkim-lab.duckdns.org/fullchain.pem"
            if [ ! -f "$CERT" ]; then
              echo "❌ SSL 인증서가 없습니다: $CERT"
              echo "   서버에서 다음을 먼저 실행하세요:"
              echo "     sudo bash /home/dev/my-platform/scripts/init-https.sh"
              echo "   인증서 발급 전이므로 nginx 재기동을 건너뜁니다 (기존 컨테이너 유지)."
              exit 0
            fi

            # jewelry(vorj-map) 동거 — jewelry.conf 가 있으면 vorj-map 인증서도 필수.
            # 없으면 nginx 가 jewelry.conf 로드 중 부팅 실패 → my-platform 까지 다운.
            if [ -f "./nginx/jewelry.conf" ]; then
              VORJ_CERT="./nginx/ssl/live/vorj-map.duckdns.org/fullchain.pem"
              if [ ! -f "$VORJ_CERT" ]; then
                echo "❌ jewelry.conf 는 있으나 vorj-map 인증서가 없습니다: $VORJ_CERT"
                echo "   먼저 발급하세요(webroot):"
                echo "     docker run --rm -v \$PWD/nginx/ssl:/etc/letsencrypt -v \$PWD/nginx/certbot-webroot:/var/www/certbot \\"
                echo "       certbot/certbot certonly --webroot -w /var/www/certbot -d vorj-map.duckdns.org --agree-tos -n --email <이메일>"
                echo "   인증서 발급 전이므로 nginx 재기동을 건너뜁니다 (기존 컨테이너 유지)."
                exit 0
              fi
            fi

            # 최종 안전망 — 실제 마운트된 설정으로 nginx -t 검증. 실패(인증서 누락/문법오류) 시 재기동 스킵.
            if ! docker compose run --rm --no-deps --entrypoint nginx nginx -t; then
              echo "❌ nginx 설정 검증(nginx -t) 실패 — 재기동 건너뜀(기존 nginx 유지)."
              echo "   위 로그의 [emerg] 메시지를 확인하세요(인증서 경로/문법)."
              exit 0
            fi

            docker compose up -d --force-recreate --no-deps nginx
            # certbot 자동 갱신 컨테이너 (없으면 기동)
            docker compose up -d --no-deps certbot || true
            docker image prune -f
          DEPLOY_EOF

      # ================================================================
      # Post-deploy 헬스체크 — 배포 후 실제 컨텍스트 부팅 확인
      # ----------------------------------------------------------------
      # 단위 테스트 통과해도 prod context 시작 시 실패 가능 (Sentry 같은 의존성 비호환 / Flyway 등).
      # 60초까지 /api/health 폴링 → 실패 시 컨테이너 로그를 artifact 로 끌어와 즉시 진단.
      # ================================================================
      - name: Health check (60s poll)
        id: healthcheck
        run: |
          HOST="${{ secrets.HOST_DEV }}"
          USER="${{ secrets.USERNAME_DEV }}"
          PORT="${{ secrets.PORT }}"

          # 컨테이너 부팅 시간 확보 (Flyway 마이그레이션 + JPA 초기화 ~30s)
          sleep 20

          for i in $(seq 1 20); do
            STATUS=$(ssh -p "$PORT" -i ~/.ssh/deploy_key "$USER@$HOST" \
              "curl -fsS -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:8080/api/health 2>/dev/null || echo 000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend health OK (시도 $i/20)"
              exit 0
            fi
            echo "⏳ 헬스체크 대기 (시도 $i/20, status=$STATUS)"
            sleep 3
          done

          echo "❌ 헬스체크 실패 — 60초 동안 200 응답 없음"
          exit 1

      - name: Collect failure logs (on failure only)
        if: failure() && steps.healthcheck.outcome == 'failure'
        run: |
          HOST="${{ secrets.HOST_DEV }}"
          USER="${{ secrets.USERNAME_DEV }}"
          PORT="${{ secrets.PORT }}"

          mkdir -p deploy-failure-logs
          ssh -p "$PORT" -i ~/.ssh/deploy_key "$USER@$HOST" \
            "cd /home/dev/my-platform && docker compose logs --tail 200 backend 2>&1" \
            > deploy-failure-logs/backend.log || true
          ssh -p "$PORT" -i ~/.ssh/deploy_key "$USER@$HOST" \
            "docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'" \
            > deploy-failure-logs/containers.txt || true

      - name: Upload failure logs
        if: failure() && steps.healthcheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-failure-logs
          path: deploy-failure-logs/
          retention-days: 7
