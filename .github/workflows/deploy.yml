name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]

jobs:
  # ================================================================
  # Frontend Build (병렬 실행)
  # ================================================================
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ================================================================
  # Backend Build (병렬 실행)
  # ================================================================
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test -PskipFrontend

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*.jar
          retention-days: 1

  # ================================================================
  # Python Backend Build (병렬 실행)
  # ================================================================
  build-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set Docker Tag
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "DOCKER_TAG=prod" >> $GITHUB_ENV
          else
            echo "DOCKER_TAG=dev" >> $GITHUB_ENV
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Python image
        uses: docker/build-push-action@v5
        with:
          context: ./python-backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-python:${{ env.DOCKER_TAG }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/my-python:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/my-python:buildcache,mode=max

  # ================================================================
  # Deploy (Frontend + Backend 완료 후 실행)
  # ================================================================
  deploy:
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend, build-python]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./

      - name: Prepare JAR file
        run: |
          JAR_FILE=$(find . -name "*.jar" | grep -v "plain" | head -n 1)
          mv "$JAR_FILE" app.jar

      - name: Set Docker Tag
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "DOCKER_TAG=prod" >> $GITHUB_ENV
          else
            echo "DOCKER_TAG=dev" >> $GITHUB_ENV
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-server:${{ env.DOCKER_TAG }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/my-server:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/my-server:buildcache,mode=max

      # ================================================================
      # 서버 배포
      # ================================================================
      - name: Setup SSH
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.ssh
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "${{ secrets.KEY_PROD }}" > ~/.ssh/deploy_key
          else
            echo "${{ secrets.KEY_DEV }}" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            HOST="${{ secrets.HOST_PROD }}"
          else
            HOST="${{ secrets.HOST_DEV }}"
          fi
          ssh-keyscan -p ${{ secrets.PORT }} "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy files to server
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            HOST="${{ secrets.HOST_PROD }}"
            USER="${{ secrets.USERNAME_PROD }}"
            NGINX_CONF="nginx/prod.conf"
          else
            HOST="${{ secrets.HOST_DEV }}"
            USER="${{ secrets.USERNAME_DEV }}"
            NGINX_CONF="nginx/dev.conf"
          fi
          PORT="${{ secrets.PORT }}"
          TARGET="/home/dev/my-platform"

          echo "📦 파일 전송: $HOST:$PORT → $TARGET"

          # 타겟 디렉토리 생성
          ssh -p "$PORT" -i ~/.ssh/deploy_key "$USER@$HOST" "mkdir -p $TARGET/nginx $TARGET/frontend"

          # docker-compose.yml
          scp -P "$PORT" -i ~/.ssh/deploy_key docker-compose.yml "$USER@$HOST:$TARGET/"

          # nginx conf
          scp -P "$PORT" -i ~/.ssh/deploy_key "$NGINX_CONF" "$USER@$HOST:$TARGET/$NGINX_CONF"

          # frontend/dist (tar로 압축 전송)
          tar -czf /tmp/frontend-dist.tar.gz -C frontend dist
          scp -P "$PORT" -i ~/.ssh/deploy_key /tmp/frontend-dist.tar.gz "$USER@$HOST:/tmp/"
          ssh -p "$PORT" -i ~/.ssh/deploy_key "$USER@$HOST" "cd $TARGET/frontend && rm -rf dist && tar -xzf /tmp/frontend-dist.tar.gz && rm /tmp/frontend-dist.tar.gz"

          echo "✅ 파일 전송 완료"

      - name: Deploy to Server
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            HOST="${{ secrets.HOST_PROD }}"
            USER="${{ secrets.USERNAME_PROD }}"
            TAG="prod"
          else
            HOST="${{ secrets.HOST_DEV }}"
            USER="${{ secrets.USERNAME_DEV }}"
            TAG="dev"
          fi
          PORT="${{ secrets.PORT }}"

          ssh -p "$PORT" -i ~/.ssh/deploy_key "$USER@$HOST" << DEPLOY_EOF
            cd /home/dev/my-platform/nginx

            if [ -f "prod.conf" ]; then
              mv prod.conf default.conf
            elif [ -f "dev.conf" ]; then
              mv dev.conf default.conf
            fi

            cd ..

            echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

            echo "🚀 배포 시작: $TAG 환경"

            docker pull ${{ secrets.DOCKER_USERNAME }}/my-server:$TAG
            docker pull ${{ secrets.DOCKER_USERNAME }}/my-python:$TAG

            docker compose up -d --force-recreate --no-deps backend python-backend
            docker compose up -d --force-recreate --no-deps nginx
            docker image prune -f
          DEPLOY_EOF
